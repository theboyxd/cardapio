<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Site Profissional Completo · YuvexPay</title>
  <meta name="theme-color" content="#0d6e61">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg-page: #f2f9f7;
      --bg-card: #ffffff;
      --bg-subtle: #f6fbfa;
      --bg-input: #ffffff;
      --border-light: #dfeeea;
      --border-input: #d2e5e0;
      --border-focus: #38c4ae;
      --mint-primary: #7ee2ce;
      --mint-hover: #67d9c2;
      --mint-active: #52ccb4;
      --teal-deep: #072b25;
      --teal-dark: #0c4f45;
      --teal-mid: #168574;
      --teal-accent: #2bb8a2;
      --text-main: #0d2622;
      --text-secondary: #5c7873;
      --text-muted: #8aa39e;
      --danger: #e5484d;
      --success: #15806d;
      --shadow-shell: 0 24px 64px rgba(8, 52, 45, 0.07), 0 4px 16px rgba(8, 52, 45, 0.04);
      --radius-shell: 24px;
      --radius-box: 16px;
      --radius-btn: 12px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 8%, rgba(126, 226, 206, 0.22), transparent 42%),
        radial-gradient(circle at 88% 92%, rgba(22, 133, 116, 0.12), transparent 45%),
        var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 40px;
    }

    /* Barra superior discreta de ambiente / retorno */
    .top-bar {
      width: 100%;
      max-width: 940px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .back-link:hover {
      color: var(--teal-dark);
    }

    .security-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-light);
      font-size: 12px;
      font-weight: 600;
      color: var(--teal-mid);
    }

    /* Container principal de 2 colunas inspirado na Imagem 2 */
    .checkout-shell {
      width: 100%;
      max-width: 940px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-shell);
      box-shadow: var(--shadow-shell);
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      overflow: hidden;
      position: relative;
    }

    /* Coluna Esquerda: Resumo da Loja e Produto */
    .col-summary {
      padding: 36px 34px;
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #ffffff 0%, #fafefd 100%);
    }

    .store-header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 22px;
    }

    .store-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(140deg, #7ee2ce 0%, #178978 58%, #094a40 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(15, 110, 96, 0.22);
      flex-shrink: 0;
      overflow: hidden;
    }

    .store-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .store-info {
      min-width: 0;
    }

    .store-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .store-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Card Hero Verde-Menta / Teal (Imagem 2) */
    .product-hero {
      position: relative;
      width: 100%;
      min-height: 290px;
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 14%, #a6f5e6 0%, rgba(166, 245, 230, 0) 48%),
        radial-gradient(circle at 88% 22%, #5fd3be 0%, rgba(95, 211, 190, 0) 52%),
        linear-gradient(145deg, #74dfca 0%, #1c9684 48%, #0b5a4f 86%, #073f37 100%);
      box-shadow: 0 14px 34px rgba(11, 88, 77, 0.22);
      margin-bottom: 22px;
      user-select: none;
    }

    /* Linhas geométricas sutis de fundo no Hero (inspiradas nas Imagens 1 e 2) */
    .product-hero-art {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
    }

    .product-hero-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .hero-center-mark {
      position: relative;
      z-index: 2;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      transition: opacity 0.25s, transform 0.25s;
    }
    .product-hero:hover .hero-center-mark {
      opacity: 0.5;
      transform: scale(1.03);
    }

    .product-hero-bottom {
      position: relative;
      z-index: 2;
    }

    .hero-product-title {
      color: #ffffff;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(4, 38, 33, 0.28);
    }

    /* Resumo de valores abaixo do card */
    .summary-item-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
    }

    .summary-item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
    }

    .summary-item-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 16px;
    }

    /* Cupom de desconto */
    .coupon-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--teal-mid);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 12px;
      width: fit-content;
    }
    .coupon-trigger:hover {
      color: var(--teal-dark);
      text-decoration: underline;
    }

    .coupon-box {
      display: none;
      gap: 8px;
      margin-bottom: 14px;
    }
    .coupon-box.open {
      display: flex;
    }

    .coupon-input {
      flex: 1;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border-input);
      border-radius: 9px;
      font-size: 13px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      color: var(--text-main);
      outline: none;
    }
    .coupon-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 196, 174, 0.15);
    }

    .coupon-apply-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid var(--teal-accent);
      background: #f1fbf9;
      color: var(--teal-dark);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .coupon-apply-btn:hover {
      background: var(--mint-primary);
    }

    .discount-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--success);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .discount-row.active {
      display: flex;
    }

    .summary-divider {
      border: none;
      border-top: 2px dotted #d3e7e2;
      margin: 8px 0 16px;
    }

    .summary-total-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .summary-total-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .summary-total-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    /* Coluna Direita: Formulário e Pagamento */
    .col-payment {
      padding: 36px 34px;
      display: flex;
      flex-direction: column;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 7px;
    }

    .field-hint {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1.5px solid var(--border-input);
      background: var(--bg-input);
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field-input::placeholder {
      color: #a0b7b2;
    }
    .field-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3.5px rgba(56, 196, 174, 0.14);
    }
    .field-input.valid {
      border-color: #7bd6c4;
    }
    .field-input.invalid {
      border-color: var(--danger);
    }

    /* Seletor de Método de Pagamento (Idêntico à Imagem 2) */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin: 4px 0 8px;
    }

    .methods-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 16px;
    }

    .methods-row-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .method-btn {
      height: 46px;
      padding: 0 15px;
      border-radius: 11px;
      border: 1.5px solid var(--border-input);
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .method-btn:hover {
      border-color: #98ded0;
      background: #fafefd;
    }

    .method-btn.active {
      border: 2px solid #3cc5b0;
      background: #f2fbf9;
      color: #082924;
      font-weight: 700;
      box-shadow: 0 3px 12px rgba(60, 197, 176, 0.12);
    }

    .method-icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--teal-mid);
      flex-shrink: 0;
    }

    .method-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(126, 226, 206, 0.35);
      color: var(--teal-dark);
    }

    /* Painéis de conteúdo de cada método */
    .method-panel {
      display: none;
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease;
    }
    .method-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Painel BOLETO (Fiel à Imagem 2) */
    .boleto-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .barcode-visual-box {
      background: #ffffff;
      border: 1px solid #e3efec;
      border-radius: 10px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .barcode-svg {
      width: 100%;
      max-width: 260px;
      height: 40px;
    }

    .boleto-line {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.5;
      word-break: break-all;
      user-select: all;
      padding: 0 4px;
    }

    .boleto-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .boleto-actions.visible {
      display: grid;
    }

    .secondary-action-btn {
      height: 36px;
      border-radius: 9px;
      border: 1px solid var(--border-input);
      background: #ffffff;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .secondary-action-btn:hover {
      border-color: var(--teal-accent);
      background: #f0fbf8;
    }

    .perk-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      padding-left: 2px;
    }
    .perk-line svg {
      color: var(--teal-accent);
      flex-shrink: 0;
    }

    /* Painel PIX */
    .pix-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 12px;
    }

    .pix-qr-wrap {
      width: 176px;
      height: 176px;
      margin: 0 auto 12px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #e1efec;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pix-qr-wrap img, .pix-qr-wrap svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pix-copy-input {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--border-input);
      background: #ffffff;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      outline: none;
    }

    .pix-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #e9f9f5;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1eb99f;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.45; }
    }

    /* Painel CARTÃO — Inspirado nos 3 Cartões Empilhados da Imagem 1 */
    .cards-showcase-wrap {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 18px 14px 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .cards-stack {
      position: relative;
      height: 192px;
      max-width: 340px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }

    .yvx-card {
      position: absolute;
      width: 248px;
      height: 154px;
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
      overflow: hidden;
    }

    /* Linhas geométricas dos cartões da Imagem 1 */
    .yvx-card-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 1. Cartão Branco (Esquerda na Imagem 1) */
    .yvx-card.card-white {
      background: linear-gradient(145deg, #ffffff 0%, #f1f6f5 100%);
      border: 1px solid #d8e5e2;
      color: #122623;
      box-shadow: 0 10px 24px rgba(10, 42, 37, 0.10);
      transform: translateX(-44px) translateY(8px) rotate(-8deg) scale(0.9);
      z-index: 1;
    }

    /* 2. Cartão Mint/Teal (Centro/Frente na Imagem 1) */
    .yvx-card.card-mint {
      background:
        radial-gradient(circle at 18% 18%, #a5f3e4 0%, rgba(165, 243, 228, 0) 50%),
        linear-gradient(135deg, #7fe3cf 0%, #279f8d 52%, #0c584e 92%, #063b34 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      box-shadow: 0 18px 38px rgba(7, 58, 50, 0.28);
      transform: translateX(0) translateY(-2px) rotate(-1deg) scale(1);
      z-index: 3;
    }

    /* 3. Cartão Preto Matte (Direita na Imagem 1) */
    .yvx-card.card-black {
      background:
        radial-gradient(circle at 80% 20%, #263330 0%, transparent 55%),
        linear-gradient(145deg, #1b2220 0%, #0d1110 65%, #070909 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      transform: translateX(46px) translateY(10px) rotate(7deg) scale(0.9);
      z-index: 2;
    }

    /* Quando o usuário seleciona qual cartão quer ver na frente */
    .cards-stack[data-front="white"] .card-white {
      transform: translateX(0) translateY(-2px) rotate(-1deg) scale(1);
      z-index: 3;
      box-shadow: 0 18px 38px rgba(10, 52, 45, 0.18);
    }
    .cards-stack[data-front="white"] .card-mint {
      transform: translateX(-44px) translateY(8px) rotate(-8deg) scale(0.9);
      z-index: 2;
    }
    .cards-stack[data-front="white"] .card-black {
      transform: translateX(46px) translateY(10px) rotate(7deg) scale(0.9);
      z-index: 1;
    }

    .cards-stack[data-front="black"] .card-black {
      transform: translateX(0) translateY(-2px) rotate(-1deg) scale(1);
      z-index: 3;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.38);
    }
    .cards-stack[data-front="black"] .card-mint {
      transform: translateX(46px) translateY(10px) rotate(7deg) scale(0.9);
      z-index: 2;
    }
    .cards-stack[data-front="black"] .card-white {
      transform: translateX(-44px) translateY(8px) rotate(-8deg) scale(0.9);
      z-index: 1;
    }

    .yvx-card-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .yvx-card-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .yvx-card-chip-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }

    .emv-chip {
      width: 30px;
      height: 22px;
      border-radius: 5px;
      background: linear-gradient(135deg, #e7d192 0%, #bfa25c 50%, #f2e2b3 100%);
      border: 1px solid rgba(0, 0, 0, 0.18);
      position: relative;
      overflow: hidden;
    }
    .card-white .emv-chip {
      background: linear-gradient(135deg, #d7dfe2 0%, #a5b2b8 50%, #eef3f5 100%);
    }
    .emv-chip::before {
      content: "";
      position: absolute;
      inset: 4px 7px;
      border: 1px solid rgba(0, 0, 0, 0.22);
      border-radius: 2px;
    }

    .yvx-card-bottom {

    }

    .yvx-card-num {

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>

  <script>window.__CHECKOUT_CFG__ = {"product_name": "Site Profissional Completo", "product_sub": "Site no ar, card\u00e1pio digital, bot\u00e3o direto do WhatsApp e destaque no Google", "amount": 597.0, "methods": ["PIX"], "return_url": "", "completion_url": "", "expires_minutes": 60, "embed_key": false, "boleto_note": "Vencimento em at\u00e9 1 ano", "badge": "Presente", "coupon_code": ""};</script>
  <script>
  (() => {
    const CFG = Object.assign({
      product_name: "Site Profissional Completo",
      product_sub: "Site no ar, cardápio digital, botão direto do WhatsApp e destaque no Google",
      amount: 597.00,
      methods: ["PIX"],
      default_method: "PIX",
      expires_minutes: 60,
      api_key: "",
      api_proxy: "",
      return_url: "",
      completion_url: ""
    }, window.__CHECKOUT_CFG__ || {});

    const params = new URLSearchParams(window.location.search);
    if (params.get("produto") || params.get("title") || params.get("empresa")) {
      const emp = params.get("empresa");
      CFG.product_name = params.get("produto") || params.get("title") || (emp ? `Site Profissional · ${emp}` : CFG.product_name);
    }
    if (params.get("descricao") || params.get("sub")) CFG.product_sub = params.get("descricao") || params.get("sub");
    if (params.get("valor") || params.get("amount") || params.get("price")) {
      const rawVal = String(params.get("valor") || params.get("amount") || params.get("price")).replace(",", ".");
      const parsed = parseFloat(rawVal);
      if (!isNaN(parsed) && parsed > 0) CFG.amount = parsed;
    }
    if (params.get("key")) CFG.api_key = params.get("key");
    if (params.get("voltar") || params.get("return_url")) CFG.return_url = params.get("voltar") || params.get("return_url");

    const brl = (v) => "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let state = {
      method: "PIX",
      subtotal: Number(CFG.amount || 597),
      loading: false,
      payment: null,
      pollTimer: null
    };

    const $ = (id) => document.getElementById(id);

    // Preenche textos iniciais
    $("ui-item-name").textContent = CFG.product_name;
    $("ui-item-desc").textContent = CFG.product_sub;
    document.title = `${CFG.product_name} · Checkout YuvexPay`;

    // Pré-preenchimento opcional via URL
    if (params.get("email")) $("inp-email").value = params.get("email");
    if (params.get("nome") || params.get("name")) $("inp-name").value = params.get("nome") || params.get("name");
    if (params.get("doc") || params.get("cpf")) $("inp-doc").value = formatCpfCnpj(params.get("doc") || params.get("cpf"));
    if (params.get("tel") || params.get("whats")) $("inp-phone").value = formatPhone(params.get("tel") || params.get("whats"));

    function totalAmount() {
      return Math.max(0, +state.subtotal.toFixed(2));
    }

    function updatePricesUI() {
      $("ui-item-price").textContent = brl(state.subtotal);
      const tot = totalAmount();
      $("ui-total-price").textContent = brl(tot);
      updateSubmitButtonUI();
    }

    function updateSubmitButtonUI() {
      const btn = $("btn-submit");
      const tot = brl(totalAmount());
      if (state.loading) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span><span>Processando</span>`;
        return;
      }
      btn.disabled = false;
      btn.innerHTML = `<span id="btn-submit-label">Gerar QR Code Pix • ${tot}</span>`;
    }

    // Máscara e validação de CPF / CNPJ
    function cleanDigits(s) {
      return String(s || "").replace(/\D/g, "");
    }

    function formatCpfCnpj(val) {
      const d = cleanDigits(val).slice(0, 14);
      if (d.length <= 11) {
        return d
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d)/, "$1.$2")
          .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      }
      return d
        .replace(/^(\d{2})(\d)/, "$1.$2")
        .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1/$2")
        .replace(/(\d{4})(\d)/, "$1-$2");
    }

    function isValidCpfCnpj(val) {
      const d = cleanDigits(val);
      if (d.length === 11) {
        if (/^(\d)\1{10}$/.test(d)) return false;
        for (let t = 9; t < 11; t++) {
          let sum = 0;
          for (let c = 0; c < t; c++) sum += Number(d[c]) * ((t + 1) - c);
          let dig = ((10 * sum) % 11) % 10;
          if (Number(d[t]) !== dig) return false;
        }
        return true;
      }
      if (d.length === 14) {
        if (/^(\d)\1{13}$/.test(d)) return false;
        const calc = (base, weights) => {
          let sum = 0;
          for (let i = 0; i < weights.length; i++) sum += Number(base[i]) * weights[i];
          const r = sum % 11;
          return r < 2 ? 0 : 11 - r;
        };
        const d1 = calc(d, [5,4,3,2,9,8,7,6,5,4,3,2]);
        const d2 = calc(d, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
        return Number(d[12]) === d1 && Number(d[13]) === d2;
      }
      return false;
    }

    function formatPhone(val) {
      const d = cleanDigits(val).slice(0, 11);
      if (d.length <= 2) return d;
      if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
      if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
      return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
    }

    $("inp-doc").addEventListener("input", (e) => {
      e.target.value = formatCpfCnpj(e.target.value);
      const d = cleanDigits(e.target.value);
      const hint = $("doc-status");
      if (d.length === 11 || d.length === 14) {
        const ok = isValidCpfCnpj(d);
        e.target.classList.toggle("valid", ok);
        e.target.classList.toggle("invalid", !ok);
        hint.textContent = ok ? (d.length === 11 ? "CPF válido ✓" : "CNPJ válido ✓") : "Documento inválido";
        hint.style.color = ok ? "#15806d" : "#e5484d";
      } else {
        e.target.classList.remove("valid", "invalid");
        hint.textContent = "";
      }
    });

    $("inp-phone").addEventListener("input", (e) => {
      e.target.value = formatPhone(e.target.value);
    });

    function showFeedback(msg, kind = "error") {
      const el = $("feedback-banner");
      el.className = `feedback-banner ${kind}`;
      el.textContent = msg;
    }

    function hideFeedback() {
      const el = $("feedback-banner");
      el.className = "feedback-banner";
      el.textContent = "";
    }

    // Copiar código Pix
    $("btn-copy-pix").addEventListener("click", async () => {
      const code = $("inp-pix-code").value;
      if (!code) return;
      try {
        await navigator.clipboard.writeText(code);
        showFeedback("Código Pix Copia e Cola copiado! Abra o app do seu banco para pagar.", "success");
      } catch (_) {
        $("inp-pix-code").select();
        document.execCommand("copy");
        showFeedback("Código Pix copiado!", "success");
      }
    });

    // Polling de status do pagamento na YuvexPay
    function startStatusPolling(paymentId, apiKey, useBackendProxy) {
      if (state.pollTimer) clearInterval(state.pollTimer);
      state.pollTimer = setInterval(async () => {
        try {
          let p = null;
          if (useBackendProxy) {
            const r = await fetch(`${useBackendProxy}/api/yuvexpay/public/payment/${encodeURIComponent(paymentId)}`);
            if (r.ok) {
              const j = await r.json();
              p = j.payment || j;
            }
          } else if (apiKey) {
            const r = await fetch(`https://api.yuvexpay.com/v1/payments/${encodeURIComponent(paymentId)}`, {
              headers: { "Authorization": `Bearer ${apiKey}` }
            });
            if (r.ok) {
              const j = await r.json();
              p = j.payment || j;
            }
          }
          if (p && (p.status === "PAID" || p.status === "CONFIRMED" || p.status === "FREE")) {
            clearInterval(state.pollTimer);
            $("pix-status-text").textContent = "Pagamento confirmado! Obrigado pela compra ✓";
            showFeedback("Pagamento aprovado com sucesso! Seu pedido já está confirmado.", "success");
            if (CFG.completion_url) {
              setTimeout(() => { window.location.href = CFG.completion_url; }, 2500);
            }
          }
        } catch (_) {}
      }, 4500);
    }

    // Criação do pagamento Pix via Servidor Radar (/api/yuvexpay/public/pay) ou Direto na API YuvexPay (https://api.yuvexpay.com/v1/payments)
    async function createYuvexPayment(customer) {
      const amount = totalAmount();
      const payload = {
        amount: amount,
        method: "PIX",
        methods: ["PIX"],
        currency: "BRL",
        mode: "headless",
        description: String(CFG.product_name || "Site Profissional Completo").slice(0, 500),
        externalId: `order-${Date.now()}`,
        expiresInMinutes: Number(CFG.expires_minutes || 60),
        customer: customer
      };
      if (CFG.return_url) payload.returnUrl = CFG.return_url;
      if (CFG.completion_url) payload.completionUrl = CFG.completion_url;

      // 1. Tenta proxy local do app Radar se disponível (mesma origem ou 127.0.0.1:8781)
      const localBases = [];
      if (CFG.api_proxy) localBases.push(CFG.api_proxy.replace(/\/$/, ""));
      if (window.location.port === "8781") localBases.push("");
      if (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost") {
        localBases.push("http://127.0.0.1:8781");
      }

      for (const base of localBases) {
        try {
          const resp = await fetch(`${base}/api/yuvexpay/public/pay`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          if (resp.ok && data && data.payment) {
            return { ...data, proxyBase: base };
          }
          if (data && data.error && data.code !== "MISSING_API_KEY") {
            throw new Error(data.error);
          }
        } catch (err) {
          if (err.message && !err.message.includes("Failed to fetch") && !err.message.includes("NetworkError")) {
            throw err;
          }
        }
      }

      // 2. Se tiver api_key configurada no checkout (ex: GitHub Pages com chave restrita payments:write)
      if (CFG.api_key) {
        const idem = `idem-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
        const apiBody = {
          amount: payload.amount,
          methods: ["PIX"],
          currency: "BRL",
          mode: "headless",
          description: payload.description,
          externalId: payload.externalId,
          expiresInMinutes: payload.expiresInMinutes,
          customer: customer
        };
        const resp = await fetch("https://api.yuvexpay.com/v1/payments", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${CFG.api_key}`,
            "Content-Type": "application/json",
            "X-Idempotency-Key": idem
          },
          body: JSON.stringify(apiBody)
        });
        const data = await resp.json();
        if (!resp.ok) {
          const msg = (data && data.error && data.error.message) || data.message || "Não foi possível processar na YuvexPay.";
          throw new Error(msg);
        }
        return { payment: data.payment || data };
      }

      // 3. Modo Demonstração Interativo (quando ainda não há chave configurada)
      await new Promise((r) => setTimeout(r, 950));
      const cleanName = (customer.name || "CLIENTE").toUpperCase().slice(0, 25);
      const pixPayload = `00020126580014BR.GOV.BCB.PIX0136yuvexpay-${Date.now()}5204000053039865406${amount.toFixed(2)}5802BR5913${cleanName}6009SAO PAULO62070503***6304ABCD`;
      return {
        demo: true,
        payment: {
          id: `demo-${Date.now()}`,
          txId: `PAY${Math.random().toString(16).slice(2, 18).toUpperCase()}`,
          amount: amount,
          status: "NEW",
          paymentMethod: "PIX",
          methodData: {
            type: "PIX",
            pixCopyPaste: pixPayload
          }
        }
      };
    }

    $("checkout-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideFeedback();

      const email = ($("inp-email").value || "").trim();
      const name = ($("inp-name").value || "").trim();
      const doc = cleanDigits($("inp-doc").value);
      const phone = cleanDigits($("inp-phone").value);

      if (!email || !email.includes("@")) {
        $("inp-email").focus();
        return showFeedback("Informe um e-mail válido para receber o comprovante.");
      }
      if (!name || name.length < 2) {
        $("inp-name").focus();
        return showFeedback("Informe seu nome completo ou razão social.");
      }
      if (!isValidCpfCnpj(doc)) {
        $("inp-doc").focus();
        return showFeedback("Informe um CPF (11 dígitos) ou CNPJ (14 dígitos) válido.");
      }

      state.loading = true;
      updateSubmitButtonUI();

      try {
        const customer = {
          name: name,
          email: email,
          document: doc,
          phone: phone ? (phone.startsWith("55") ? `+${phone}` : `+55${phone}`) : undefined
        };

        const res = await createYuvexPayment(customer);
        const payment = res.payment || {};
        state.payment = payment;
        const md = payment.methodData || {};

        if (md.qrCodeBase64) {
          const src = md.qrCodeBase64.startsWith("data:") ? md.qrCodeBase64 : `data:image/png;base64,${md.qrCodeBase64}`;
          $("pix-qr-wrap").innerHTML = `<img src="${src}" alt="QR Code Pix YuvexPay">`;
        }
        if (md.pixCopyPaste) {
          $("inp-pix-code").value = md.pixCopyPaste;
          $("pix-copy-area").style.display = "block";
        }
        $("pix-status-text").textContent = "QR Code gerado! Escaneie ou use o Pix Copia e Cola";
        showFeedback("QR Code Pix gerado com sucesso! Aguardando confirmação do pagamento...", "success");
        if (!res.demo && payment.id) {
          startStatusPolling(payment.id, CFG.api_key, res.proxyBase);
        }
      } catch (err) {
        showFeedback(err.message || "Erro ao processar pagamento. Confira os dados e tente novamente.", "error");
      } finally {
        state.loading = false;
        updateSubmitButtonUI();
      }
    });

    updatePricesUI();
  })();
  </script>
</body>
</html>
